name: Optimized release regression
on:
  push:
    branches: [main]
    paths: ['app/proguard-rules.pro', '.github/workflows/release-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Build optimized release candidate with ephemeral test identity
        run: |
          export AYTDLP_KEYSTORE="$RUNNER_TEMP/test-release.jks"
          export AYTDLP_STORE_PASSWORD="$(openssl rand -hex 32)"
          export AYTDLP_KEY_PASSWORD="$AYTDLP_STORE_PASSWORD"
          echo "::add-mask::$AYTDLP_STORE_PASSWORD"
          export AYTDLP_VERSION_NAME=0.1.1
          export AYTDLP_VERSION_CODE=1001
          keytool -genkeypair -alias aytdlp -keyalg RSA -keysize 4096 -validity 365 -storetype JKS -keystore "$AYTDLP_KEYSTORE" -storepass:env AYTDLP_STORE_PASSWORD -keypass:env AYTDLP_KEY_PASSWORD -dname 'CN=CI release regression'
          ./gradlew assembleRelease lintRelease --max-workers=2
          mkdir -p release-candidate
          cp app/build/outputs/apk/release/*.apk release-candidate/
          cp "$ANDROID_HOME/build-tools/37.0.0/lib/apksigner.jar" release-candidate/
          cp app/build/outputs/mapping/release/mapping.txt release-candidate/
          for apk in release-candidate/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$apk"
            python3 scripts/audit_native.py "$apk" > "$apk.native.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-release-candidate
          path: release-candidate/
  startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis_ps16k
          - api: 37
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: optimized-release-candidate
          path: release-candidate
      - name: Enable KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/check_release_startup.sh release-candidate/app-x86_64-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-release-startup-api-${{ matrix.api }}
          path: release-startup/
