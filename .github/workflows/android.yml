name: Android quality and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install current SDK components
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified engine and rebuild misaligned WebP dependencies
        run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Process interruption tests
        run: python3 scripts/test_process_faults.py
      - name: Build, unit tests and Android lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Audit packaged native libraries
        run: |
          python3 scripts/audit_native.py app/build/outputs/apk/debug/app-debug.apk > native-audit.json
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aytdlp-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            native-audit.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install current SDK components
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Sign release using owner-managed secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AYTDLP_KEYSTORE_BASE64 }}
          AYTDLP_STORE_PASSWORD: ${{ secrets.AYTDLP_STORE_PASSWORD }}
          AYTDLP_KEY_PASSWORD: ${{ secrets.AYTDLP_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Signing secrets are required; refusing to publish an unsigned release.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aytdlp.jks"
          export AYTDLP_KEYSTORE="$RUNNER_TEMP/aytdlp.jks"
          ./gradlew assembleRelease testReleaseUnitTest lintRelease
      - name: Audit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$apk"
            python3 scripts/audit_native.py "$apk" > "$apk.native.json"
          done
          sha256sum app/build/outputs/apk/release/*.apk > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk SHA256SUMS --title "Aytdlp $GITHUB_REF_NAME" --notes-file SHA256SUMS
