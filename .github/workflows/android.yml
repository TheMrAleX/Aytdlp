name: Android quality and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, for example v0.1.1'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install current SDK components
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verified engine and rebuild misaligned WebP dependencies
        run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Process interruption tests
        run: |
          python3 scripts/test_process_faults.py
          python3 scripts/test_quality_presets.py
      - name: Build, unit tests and Android lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug ktlintCheck detekt --max-workers=2
      - name: Audit packaged native libraries
        run: |
          python3 scripts/audit_native.py app/build/outputs/apk/debug/app-universal-debug.apk > native-audit.json
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-universal-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aytdlp-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            native-audit.json
  device_16kb:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Enable hardware acceleration for the emulator
        run: |
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Native runtime and UI tests on 16 KB emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run_device_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16kb-device-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [verify, device_16kb]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aytdlp-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${REQUESTED_RELEASE_TAG:-}"
          if test -z "$tag"; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag=v0.1.2; fi
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          if gh release view "$tag" > /dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.release.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK path
        if: steps.release.outputs.needed == 'true'
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0' 'ndk;28.2.13676358'
        if: steps.release.outputs.needed == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.needed == 'true'
      - name: Prepare engine and native dependencies
        if: steps.release.outputs.needed == 'true'
        run: |
          python3 scripts/prepare_engine.py
          python3 scripts/prepare_native.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --ninja "$(command -v ninja)"
      - name: Build, sign and verify release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PUBLISH: '0'
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          KEYSTORE_BASE64: ${{ secrets.AYTDLP_KEYSTORE_BASE64 }}
          AYTDLP_STORE_PASSWORD: ${{ secrets.AYTDLP_STORE_PASSWORD }}
          AYTDLP_KEY_PASSWORD: ${{ secrets.AYTDLP_KEY_PASSWORD }}
        run: bash scripts/release.sh
      - name: Enable release emulator hardware acceleration
        if: steps.release.outputs.needed == 'true'
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Cold-start optimized release before publication
        if: steps.release.outputs.needed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/check_release_startup.sh "release-assets/Aytdlp-${RELEASE_TAG#v}-x86_64.apk"
      - name: Publish tested release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/publish_release.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.needed == 'true'
        with:
          name: aytdlp-release-and-reports
          path: |
            release-assets/
            release-startup/
            app/build/reports/
